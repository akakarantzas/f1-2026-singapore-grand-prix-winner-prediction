name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  model-tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build training image
        run: docker compose build train

      - name: run model regression tests
        run: docker compose run --rm train python -m unittest discover -s tests -v
